name: piecewise-linear-integration

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: piecewise_linear_test
      POSTGRES_USER: piecewise_linear
      POSTGRES_PASSWORD: piecewise_linear
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U piecewise_linear -d piecewise_linear_test"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ./backend
      target: development
    environment:
      DATABASE_URL: postgresql+asyncpg://piecewise_linear:piecewise_linear@db:5432/piecewise_linear_test
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  tests:
    build:
      context: ./backend
      target: testing
    environment:
      DATABASE_URL: postgresql+asyncpg://piecewise_linear:piecewise_linear@db:5432/piecewise_linear_test
      TEST_DATABASE_URL: postgresql+asyncpg://piecewise_linear:piecewise_linear@db:5432/piecewise_linear_test
    command: ["pytest", "tests/integration", "-q"]
    depends_on:
      migrate:
        condition: service_completed_successfully
