name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          uv sync --project backend --frozen
          npm --prefix frontend ci
      - name: Check backend
        run: |
          uv run --project backend ruff check backend
          uv run --project backend ruff format --check backend
          uv run --project backend pyright --project backend
      - name: Test backend with coverage
        run: |
          uv run --project backend coverage run --rcfile=backend/pyproject.toml -m pytest backend/tests/unit -q
          uv run --project backend coverage report --rcfile=backend/pyproject.toml
      - name: Check and test frontend
        run: |
          npm --prefix frontend run lint
          npm --prefix frontend run typecheck
          npm --prefix frontend run test
          npm --prefix frontend run build

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: piecewise_linear_test
          POSTGRES_USER: piecewise_linear
          POSTGRES_PASSWORD: piecewise_linear
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U piecewise_linear -d piecewise_linear_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://piecewise_linear:piecewise_linear@127.0.0.1:5432/piecewise_linear_test
      TEST_DATABASE_URL: postgresql+asyncpg://piecewise_linear:piecewise_linear@127.0.0.1:5432/piecewise_linear_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
      - name: Install backend
        run: uv sync --project backend --frozen
      - name: Apply migrations
        working-directory: backend
        run: uv run alembic upgrade head
      - name: Run integration tests
        run: uv run --project backend pytest backend/tests/integration -q

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install chromium --with-deps
      - name: Start Compose environment
        run: docker compose up --detach --build
      - name: Run browser scenarios
        run: npm --prefix frontend run test:e2e
      - name: Stop Compose environment
        if: always()
        run: docker compose down --volumes --remove-orphans

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check production images and health
        shell: pwsh
        run: ./scripts/check-containers.ps1
